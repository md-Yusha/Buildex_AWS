AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BuildeX Coder IDE - Serverless API Gateway & Lambda Handlers

Parameters:
  UsersTableName:
    Type: String
    Default: BuildexUsers
  ProjectsTableName:
    Type: String
    Default: BuildexProjects
  SessionsTableName:
    Type: String
    Default: BuildexSessions
  ProgressTableName:
    Type: String
    Default: BuildexProgress
  ChatsTableName:
    Type: String
    Default: BuildexChats
  StorageBucketName:
    Type: String
    Default: buildex-projects-storage-052477895001
  CognitoDomainPrefix:
    Type: String
    Default: buildex-ide
  CognitoClientId:
    Type: String
    Default: 1t0auvpbcr0lb9eb5c3tdunog5
  ApiGatewayBaseUrl:
    Type: String
    Default: https://vrgr3ltxr2.execute-api.ap-south-1.amazonaws.com
  PaymentsTableName:
    Type: String
    Default: BuildexPayments
  CognitoUserPoolId:
    Type: String
    Default: ap-south-1_DFJckvu7H
  RazorpayKeyId:
    Type: String
    Default: rzp_test_placeholder
  RazorpayKeySecret:
    Type: String
    Default: rzp_secret_placeholder

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTableName
        PROJECTS_TABLE: !Ref ProjectsTableName
        SESSIONS_TABLE: !Ref SessionsTableName
        PROGRESS_TABLE: !Ref ProgressTableName
        CHATS_TABLE: !Ref ChatsTableName
        STORAGE_BUCKET: !Ref StorageBucketName
        COGNITO_DOMAIN_PREFIX: !Ref CognitoDomainPrefix
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        COGNITO_DOMAIN: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
        BUILDEX_API_BASE_URL: !Ref ApiGatewayBaseUrl
        PAYMENTS_TABLE: !Ref PaymentsTableName
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
        BEDROCK_DEFAULT_MODEL: "anthropic.claude-3-haiku-20240307-v1:0"
        BEDROCK_CHEAP_MODEL: "amazon.nova-micro-v1:0"

Resources:
  # ==========================================
  # 1. HTTP API GATEWAY WITH CORS
  # ==========================================
  BuildexHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowOrigins:
          - "*"

  # ==========================================
  # 2. LAMBDA FUNCTIONS
  # ==========================================
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/health.handler
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/health
            Method: GET

  ChatStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/chatStream.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTableName
      Events:
        ChatApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/chat/stream
            Method: POST

  UserProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/userProgress.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTableName
      Events:
        GetProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/user/progress
            Method: GET
        PostProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/user/progress
            Method: POST

  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/projects.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTableName
        - S3CrudPolicy:
            BucketName: !Ref StorageBucketName
      Events:
        GetProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/projects
            Method: GET
        PostProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/projects
            Method: POST
        PresignedUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/projects/presigned-url
            Method: POST

  # ==========================================
  # AUTH FUNCTIONS (100% CLOUD-NATIVE COGNITO)
  # ==========================================
  AuthSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/authSession.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTableName
      Events:
        PostSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/auth/session
            Method: POST
        GetSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/auth/session
            Method: GET

  AuthCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/authCallback.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTableName
      Events:
        GetCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/auth/callback
            Method: GET
        GetLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/auth/logout
            Method: GET

  # ==========================================
  # PAYMENT FUNCTIONS (RAZORPAY GATEWAY & SYNC)
  # ==========================================
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/payment.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTableName
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/payment/create-order
            Method: POST
        VerifyPayment:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/payment/verify
            Method: POST
        PaymentConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref BuildexHttpApi
            Path: /api/payment/config
            Method: GET

Outputs:
  HttpApiUrl:
    Description: "Base URL for BuildeX API Gateway"
    Value: !Sub "https://${BuildexHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: BuildexHttpApiUrl
