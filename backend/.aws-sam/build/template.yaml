AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BuildeX Coder IDE - Serverless API Gateway & Lambda Handlers
Parameters:
  UsersTableName:
    Type: String
    Default: BuildexUsers
  ProjectsTableName:
    Type: String
    Default: BuildexProjects
  SessionsTableName:
    Type: String
    Default: BuildexSessions
  ProgressTableName:
    Type: String
    Default: BuildexProgress
  ChatsTableName:
    Type: String
    Default: BuildexChats
  StorageBucketName:
    Type: String
    Default: buildex-projects-storage-052477895001
  CognitoDomainPrefix:
    Type: String
    Default: buildex-ide
  CognitoClientId:
    Type: String
    Default: 1t0auvpbcr0lb9eb5c3tdunog5
  ApiGatewayBaseUrl:
    Type: String
    Default: https://vrgr3ltxr2.execute-api.ap-south-1.amazonaws.com
Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
    - arm64
    Environment:
      Variables:
        USERS_TABLE:
          Ref: UsersTableName
        PROJECTS_TABLE:
          Ref: ProjectsTableName
        SESSIONS_TABLE:
          Ref: SessionsTableName
        PROGRESS_TABLE:
          Ref: ProgressTableName
        CHATS_TABLE:
          Ref: ChatsTableName
        STORAGE_BUCKET:
          Ref: StorageBucketName
        COGNITO_DOMAIN_PREFIX:
          Ref: CognitoDomainPrefix
        COGNITO_CLIENT_ID:
          Ref: CognitoClientId
        COGNITO_DOMAIN:
          Fn::Sub: https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
        BUILDEX_API_BASE_URL:
          Ref: ApiGatewayBaseUrl
        BEDROCK_DEFAULT_MODEL: anthropic.claude-3-haiku-20240307-v1:0
        BEDROCK_CHEAP_MODEL: amazon.nova-micro-v1:0
Resources:
  BuildexHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        AllowOrigins:
        - '*'
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HealthFunction
      Handler: src/handlers/health.handler
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/health
            Method: GET
    Metadata:
      SamResourceId: HealthFunction
  ChatStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ChatStreamFunction
      Handler: src/handlers/chatStream.handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          - bedrock:InvokeModelWithResponseStream
          Resource: '*'
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SessionsTableName
      Events:
        ChatApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/chat/stream
            Method: POST
    Metadata:
      SamResourceId: ChatStreamFunction
  UserProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: UserProgressFunction
      Handler: src/handlers/userProgress.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProgressTableName
      Events:
        GetProgress:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/user/progress
            Method: GET
        PostProgress:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/user/progress
            Method: POST
    Metadata:
      SamResourceId: UserProgressFunction
  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ProjectsFunction
      Handler: src/handlers/projects.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProjectsTableName
      - S3CrudPolicy:
          BucketName:
            Ref: StorageBucketName
      Events:
        GetProjects:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/projects
            Method: GET
        PostProject:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/projects
            Method: POST
        PresignedUrl:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/projects/presigned-url
            Method: POST
    Metadata:
      SamResourceId: ProjectsFunction
  AuthSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthSessionFunction
      Handler: src/handlers/authSession.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SessionsTableName
      Events:
        PostSession:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/auth/session
            Method: POST
        GetSession:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/auth/session
            Method: GET
    Metadata:
      SamResourceId: AuthSessionFunction
  AuthCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthCallbackFunction
      Handler: src/handlers/authCallback.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SessionsTableName
      Events:
        GetCallback:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/auth/callback
            Method: GET
        GetLogout:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: BuildexHttpApi
            Path: /api/auth/logout
            Method: GET
    Metadata:
      SamResourceId: AuthCallbackFunction
Outputs:
  HttpApiUrl:
    Description: Base URL for BuildeX API Gateway
    Value:
      Fn::Sub: https://${BuildexHttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: BuildexHttpApiUrl
